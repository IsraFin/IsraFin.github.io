function selectGoal(key){
  state.goal = key;
  state.goalGlow = {};
  state.goalVisited = {};
  state.goalJustFinished = false;
  const cats = GOAL_MAP[key] || [];
  cats.forEach(id => { state.goalGlow[id] = true; });
  goto('home');
}

function checkGoalComplete(){
  if(!state.goal) return;
  const cats = GOAL_MAP[state.goal] || [];
  const allVisited = cats.every(id => state.goalVisited[id]);
  if(allVisited){
    state.goal = null;
    state.goalGlow = {};
    state.goalVisited = {};
    state.goalJustFinished = true;
    goto('goals');
  }
}

function renderToolCard(kind, emoji, color){
  const names = { compound:'toolCompoundName', paycheck:'toolPaycheckName', sim:'toolSimName' };
  const descs = { compound:'toolCompoundDesc', paycheck:'toolPaycheckDesc', sim:'toolSimDesc' };
  return `
  <button class="tool-card" data-tool="${kind}">
    <div class="tool-icon" style="background:${color}22;">${emoji}</div>
    <div>
      <div class="tool-name">${t(names[kind])}</div>
      <div class="tool-desc">${t(descs[kind])}</div>
    </div>
  </button>`;
}

function ringSvg(pct){
  const r=22, c=2*Math.PI*r, offset = c - (pct/100)*c;
  return `<svg viewBox="0 0 52 52" width="52" height="52">
    <circle cx="26" cy="26" r="${r}" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="5"/>
    <circle cx="26" cy="26" r="${r}" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${offset}" transform="rotate(-90 26 26)"/>
  </svg>`;
}

function flatTopicList(cat){
  let flat=[];
  cat.subs.forEach((s,sIdx)=>s.topics.forEach((tp,tIdx)=>flat.push({sIdx,tIdx,topic:tp})));
  return flat;
}

function renderLesson(){
  const cat = findCategory(state.activeTopic.catId);
  const flat = flatTopicList(cat);
  const curFlatIdx = flat.findIndex(f=>f.sIdx===state.activeTopic.subIdx && f.tIdx===state.activeTopic.topicIdx);
  const cur = flat[curFlatIdx];
  const tp = cur.topic;
  const sub = cat.subs[cur.sIdx];
  const isDone = !!state.progress[tp.id];
  const hasPrev = curFlatIdx>0, hasNext = curFlatIdx<flat.length-1;

  const header = `
    ${renderTopbar()}
    <div class="subhead">
      <button class="back-btn icon-flip" id="backCat" aria-label="${t('backAria')}">${dirFor(state.lang)==='rtl'?'›':'‹'}</button>
      <div class="cat-title-row">
        <div class="cat-title-icon" style="background:${cat.color}22; font-size:16px;">${cat.icon}</div>
        <div>
          <div class="cat-title" style="font-size:15.5px;">${cat.name[state.lang]}</div>
          <div class="cat-sub-count">${sub.name[state.lang]}</div>
        </div>
      </div>
    </div>`;

  const footer = `
    <div class="lesson-nav">
      <button class="nav-btn" id="prevTopic" ${!hasPrev?'disabled':''}>${dirFor(state.lang)==='rtl'?'→':'←'} ${t('prev')}</button>
      <button class="nav-btn primary" id="nextTopic" ${!hasNext?'disabled':''}>${t('next')} ${dirFor(state.lang)==='rtl'?'←':'→'}</button>
    </div>`;

  const quizBtn = isDone
    ? `<button class="lesson-mark done" id="retakeQuizBtn">✓ ${t('markedDone')} · ${t('quizRetake')}</button>`
    : `<button class="lesson-mark" id="startTopicQuizBtn">📝 ${t('takeQuiz')}</button>
       <div class="quiz-gate-note">${t('quizGateNote')}</div>`;

  if(state.quickLearn){
    // Step-card mode
    const bodyText = tp[state.lang].b;
    const cards = splitLessonCards(bodyText, state.lang);
    const ci = state.lessonCard || 0;
    const totalCards = cards.length + 1;
    const isQuizCard = ci >= cards.length;
    const cardEmojis = ['📖','💡','🔑','✨','🧩'];
    const dots = Array.from({length:totalCards},(_,i)=>`<div class="step-dot${i===ci?' active':''}${i<ci?' done':''}"></div>`).join('');
    let cardContent;
    if(isQuizCard){
      cardContent = `<div class="step-card quiz-step"><div class="step-emoji">📝</div><div class="step-label">${t('quizReady')}</div>${quizBtn}</div>`;
    } else {
      cardContent = `<div class="step-card"><div class="step-emoji">${cardEmojis[ci % cardEmojis.length]}</div><div class="step-body">${highlightTerms(cards[ci], state.lang)}</div></div>`;
    }
    return `<div class="screen active" style="--accent:${cat.color}22; --accent-deep:${cat.color};">${header}
      <div class="lesson-card">
        <div class="lesson-title">${tp[state.lang].t}</div>
        <div class="step-dots">${dots}</div>
        <div class="step-container" id="stepContainer">${cardContent}</div>
        <div class="step-nav">
          <button class="step-btn" id="stepPrev" ${ci===0?'disabled':''}>${dirFor(state.lang)==='rtl'?'›':'‹'}</button>
          <span class="step-counter">${ci+1} / ${totalCards}</span>
          <button class="step-btn primary" id="stepNext" ${isQuizCard?'disabled':''}>${dirFor(state.lang)==='rtl'?'‹':'›'}</button>
        </div>
      </div>${footer}</div>`;
  } else {
    // Normal mode
    return `<div class="screen active" style="--accent:${cat.color}22; --accent-deep:${cat.color};">${header}
      <div class="lesson-card">
        <div class="lesson-title">${tp[state.lang].t}</div>
        <div class="lesson-body">${highlightTerms(tp[state.lang].b, state.lang)}</div>
        ${quizBtn}
      </div>${footer}</div>`;
  }
}

function splitLessonCards(text, lang){
  // Split on sentence boundaries
  let parts;
  if(lang === 'en'){
    parts = text.split(/(?<=\.)\s+(?=[A-Z])/);
  } else {
    parts = text.split(/(?<=\.)\s+/);
  }
  parts = parts.map(s=>s.trim()).filter(s=>s.length>0);
  if(parts.length === 0) parts = [text];
  return parts;
}

  {cat:'basics', q:{en:'What is compound interest?',he:'מה זה ריבית דריבית?',ar:'ما هي الفائدة المركبة؟'}, a:{en:'Interest earned on both your original money AND the interest it already earned. It\'s like a snowball — the longer you leave it, the faster it grows. At 7% annual return, your money doubles roughly every 10 years.',he:'ריבית שמרוויחים גם על הסכום המקורי וגם על הריבית שכבר הצטברה. זה כמו כדור שלג — ככל שמשאירים יותר זמן, כך גדל מהר יותר. בתשואה שנתית של 7%, הכסף מוכפל בערך כל 10 שנים.',ar:'فائدة تُكسب على المبلغ الأصلي وعلى الفائدة المتراكمة سابقاً. مثل كرة الثلج — كلما تركتها أطول، كبرت أسرع. بعائد 7% سنوياً، يتضاعف مالك تقريباً كل 10 سنوات.'}},
  {cat:'basics', q:{en:'How much should I save from my income?',he:'כמה כדאי לחסוך מההכנסה?',ar:'كم يجب أن أدخر من دخلي؟'}, a:{en:'A popular guideline is 50/30/20: 50% for needs (rent, food, bills), 30% for wants (entertainment, shopping), and 20% for savings. Even saving 10% is a great start if 20% feels too much.',he:'כלל פופולרי הוא 50/30/20: 50% לצרכים (שכירות, אוכל, חשבונות), 30% לרצונות (בילויים, קניות), ו-20% לחיסכון. גם 10% זה התחלה מצוינת אם 20% מרגיש יותר מדי.',ar:'قاعدة شائعة هي 50/30/20: 50% للاحتياجات (إيجار، طعام، فواتير)، 30% للرغبات (ترفيه، تسوق)، و20% للادخار. حتى 10% بداية ممتازة إذا شعرت أن 20% كثير.'}},
  {cat:'basics', q:{en:'What is an emergency fund and how much do I need?',he:'מה זה קרן חירום וכמה צריך?',ar:'ما هو صندوق الطوارئ وكم أحتاج؟'}, a:{en:'Money set aside for unexpected expenses — car repair, medical bill, job loss. Aim for 3-6 months of living expenses. Keep it in a savings account where you can access it quickly but won\'t spend it casually.',he:'כסף שמופרש להוצאות בלתי צפויות — תיקון רכב, חשבון רפואי, אובדן עבודה. המטרה היא 3-6 חודשי הוצאות מחיה. שמרו אותו בחשבון חיסכון שנגיש מהר אבל לא מוציאים ממנו בקלות.',ar:'مال مخصص للنفقات غير المتوقعة — إصلاح سيارة، فاتورة طبية، فقدان عمل. استهدف 3-6 أشهر من نفقات المعيشة. احتفظ به في حساب توفير يسهل الوصول إليه لكن لن تنفقه بسهولة.'}},
  {cat:'taxes', q:{en:'What taxes do I pay in Israel?',he:'אילו מיסים משלמים בישראל?',ar:'ما الضرائب التي أدفعها في إسرائيل؟'}, a:{en:'The main ones: Income Tax (Mas Hachnasa) — deducted from your salary based on brackets. VAT (Ma\'am) — 17% added to most purchases. National Insurance (Bituach Leumi) — mandatory from age 18, funds social benefits. Arnona — local property tax paid to your municipality.',he:'העיקריים: מס הכנסה — מנוכה מהמשכורת לפי מדרגות. מע"מ — 17% שמתווסף לרוב הרכישות. ביטוח לאומי — חובה מגיל 18, ממן קצבאות סוציאליות. ארנונה — מס רכוש מקומי שמשולם לרשות המקומית.',ar:'الرئيسية: ضريبة الدخل — تُخصم من الراتب حسب الشرائح. ضريبة القيمة المضافة (ماعم) — 17% تُضاف لمعظم المشتريات. التأمين الوطني (بيتواح لئومي) — إلزامي من سن 18، يموّل المزايا الاجتماعية. أرنونا — ضريبة أملاك محلية.'}},
  {cat:'taxes', q:{en:'What are tax credit points (Nekudot Zikuy)?',he:'מה זה נקודות זיכוי?',ar:'ما هي نقاط الإعفاء الضريبي؟'}, a:{en:'Points that reduce your income tax. Every Israeli resident gets basic points. Extra points for: young workers (under 26), soldiers who completed service, new immigrants, parents, and more. Each point reduces your annual tax by a set amount.',he:'נקודות שמפחיתות את מס ההכנסה. כל תושב ישראל מקבל נקודות בסיסיות. נקודות נוספות ל: עובדים צעירים (עד 26), חיילים משוחררים, עולים חדשים, הורים ועוד. כל נקודה מפחיתה את המס השנתי בסכום קבוע.',ar:'نقاط تقلل ضريبة الدخل. كل مقيم إسرائيلي يحصل على نقاط أساسية. نقاط إضافية لـ: العمال الشباب (أقل من 26)، الجنود المسرحين، المهاجرين الجدد، الوالدين، وغيرهم. كل نقطة تقلل الضريبة السنوية بمبلغ محدد.'}},
  {cat:'taxes', q:{en:'What is VAT (Ma\'am) and how much is it?',he:'מה זה מע"מ וכמה הוא?',ar:'ما هي ضريبة القيمة المضافة وكم نسبتها؟'}, a:{en:'Value Added Tax — a consumption tax of 17% added to almost everything you buy in Israel. It\'s already included in the price you see on the shelf. One of the highest VAT rates in the developed world.',he:'מס ערך מוסף — מס צריכה של 17% שמתווסף כמעט לכל מה שקונים בישראל. הוא כבר כלול במחיר שרואים על המדף. אחד משיעורי המע"מ הגבוהים בעולם המפותח.',ar:'ضريبة القيمة المضافة — ضريبة استهلاك 17% تُضاف لكل ما تشتريه تقريباً في إسرائيل. مشمولة مسبقاً في السعر على الرف. من أعلى معدلات ضريبة القيمة المضافة في العالم المتقدم.'}},
  {cat:'banking', q:{en:'How do I open a bank account in Israel?',he:'איך פותחים חשבון בנק בישראל?',ar:'كيف أفتح حساباً بنكياً في إسرائيل؟'}, a:{en:'Bring your Teudat Zehut (ID card) and proof of address to any bank branch. Compare fees and services between banks first — they vary a lot. Minors can open an account with a parent. Since 2017, switching banks is easy by law.',he:'קחו תעודת זהות ואישור כתובת לכל סניף בנק. השוו עמלות ושירותים בין בנקים לפני — יש הבדלים גדולים. קטינים יכולים לפתוח חשבון עם הורה. מאז 2017 מעבר בנק קל על פי חוק.',ar:'أحضر بطاقة هويتك (تعودات زهوت) وإثبات عنوان لأي فرع بنك. قارن الرسوم والخدمات بين البنوك أولاً — تختلف كثيراً. القاصرون يمكنهم فتح حساب مع والد. منذ 2017 تبديل البنوك سهل قانونياً.'}},
  {cat:'banking', q:{en:'What is the difference between a debit card and credit card?',he:'מה ההבדל בין כרטיס חיוב לכרטיס אשראי?',ar:'ما الفرق بين بطاقة الخصم وبطاقة الائتمان؟'}, a:{en:'Debit card takes money from your account immediately when you pay. Credit card lets you buy now and pay later (usually end of month) — convenient but can lead to debt if you spend more than you have.',he:'כרטיס חיוב מוריד כסף מהחשבון מיד כששמשלמים. כרטיס אשראי מאפשר לקנות עכשיו ולשלם אחר כך (בדרך כלל סוף חודש) — נוח אבל עלול ליצור חוב אם מוציאים יותר ממה שיש.',ar:'بطاقة الخصم تخصم المال من حسابك فوراً عند الدفع. بطاقة الائتمان تتيح الشراء الآن والدفع لاحقاً (عادةً نهاية الشهر) — مريحة لكن قد تؤدي لديون إذا أنفقت أكثر مما لديك.'}},
  {cat:'banking', q:{en:'What are Bit and PayBox?',he:'מה זה ביט ופייבוקס?',ar:'ما هي بيت وبيبوكس؟'}, a:{en:'Israeli apps for sending money instantly between people — like Venmo or Cash App. They connect to your bank account. Great for splitting bills, paying friends back, or small transfers. Free for personal use.',he:'אפליקציות ישראליות להעברת כסף מיידית בין אנשים. הן מחוברות לחשבון הבנק. מצוינות לפיצול חשבונות, החזרת כסף לחברים, או העברות קטנות. חינם לשימוש אישי.',ar:'تطبيقات إسرائيلية لإرسال المال فوراً بين الأشخاص. مرتبطة بحسابك البنكي. ممتازة لتقسيم الفواتير، إرجاع المال للأصدقاء، أو التحويلات الصغيرة. مجانية للاستخدام الشخصي.'}},
  {cat:'investing', q:{en:'What is an index fund?',he:'מה זה קרן מחקה מדד?',ar:'ما هو صندوق المؤشر؟'}, a:{en:'A fund that automatically tracks a whole market index (like the S&P 500 or TA-125). Instead of picking individual stocks, you invest in hundreds of companies at once. Low fees, built-in diversification, and historically hard to beat.',he:'קרן שעוקבת אוטומטית אחרי מדד שוק שלם (כמו S&P 500 או ת"א 125). במקום לבחור מניות בודדות, משקיעים במאות חברות בבת אחת. עמלות נמוכות, פיזור מובנה, והיסטורית קשה להכות.',ar:'صندوق يتتبع تلقائياً مؤشر سوق كامل (مثل S&P 500 أو TA-125). بدلاً من اختيار أسهم فردية، تستثمر في مئات الشركات دفعة واحدة. رسوم منخفضة، تنويع مدمج، وتاريخياً يصعب التفوق عليه.'}},
  {cat:'investing', q:{en:'Can I invest with a small amount of money?',he:'אפשר להשקיע עם סכום קטן?',ar:'هل يمكنني الاستثمار بمبلغ صغير؟'}, a:{en:'Yes! Many Israeli brokers and apps let you start with as little as a few hundred shekels. The key is starting early — even small amounts grow significantly over time thanks to compound interest.',he:'כן! ברוקרים ואפליקציות רבים בישראל מאפשרים להתחיל עם כמה מאות שקלים. המפתח הוא להתחיל מוקדם — גם סכומים קטנים גדלים משמעותית עם הזמן בזכות ריבית דריבית.',ar:'نعم! العديد من الوسطاء والتطبيقات الإسرائيلية يسمحون بالبدء بمئات الشيكلات. المفتاح هو البدء مبكراً — حتى المبالغ الصغيرة تنمو بشكل كبير مع الوقت بفضل الفائدة المركبة.'}},
  {cat:'safety', q:{en:'How do I spot a financial scam?',he:'איך מזהים הונאה פיננסית?',ar:'كيف أكتشف الاحتيال المالي؟'}, a:{en:'Red flags: guaranteed high returns, pressure to act fast, unregistered/unlicensed service, WhatsApp investment groups, "secret" methods, and asking for your password or bank details. If it sounds too good to be true, it is.',he:'דגלים אדומים: תשואות גבוהות מובטחות, לחץ לפעול מהר, שירות לא רשום/ללא רישיון, קבוצות השקעה בווטסאפ, שיטות "סודיות", ובקשת סיסמה או פרטי בנק. אם זה נשמע טוב מדי מכדי להיות אמיתי — זה כנראה לא אמיתי.',ar:'علامات تحذير: عوائد عالية مضمونة، ضغط للتصرف بسرعة، خدمة غير مسجلة/مرخصة، مجموعات استثمار واتساب، طرق "سرية"، وطلب كلمة مرور أو تفاصيل بنكية. إذا بدا الأمر أجمل من أن يكون حقيقياً — فعلى الأرجح هو كذلك.'}},
  {cat:'safety', q:{en:'What is phishing and how do I protect myself?',he:'מה זה פישינג ואיך מתגוננים?',ar:'ما هو التصيد وكيف أحمي نفسي؟'}, a:{en:'Fake emails, texts, or calls pretending to be your bank or a trusted service, trying to steal your login info. Never click suspicious links, never share passwords, and if in doubt — hang up and call your bank directly using the number on your card.',he:'הודעות, אימיילים או שיחות מזויפות שמתחזות לבנק או שירות מהימן, ומנסות לגנוב פרטי התחברות. לעולם לא ללחוץ על קישורים חשודים, לא לשתף סיסמאות, ובמקרה של ספק — לנתק ולהתקשר לבנק ישירות מהמספר שעל הכרטיס.',ar:'رسائل أو مكالمات مزيفة تتظاهر بأنها من بنكك أو خدمة موثوقة، تحاول سرقة معلومات تسجيل الدخول. لا تنقر على روابط مشبوهة، لا تشارك كلمات المرور، وإذا شككت — أغلق واتصل ببنكك مباشرة من الرقم على بطاقتك.'}},
  {cat:'work', q:{en:'What is Bituach Leumi (National Insurance)?',he:'מה זה ביטוח לאומי?',ar:'ما هو التأمين الوطني (بيتواح لئومي)؟'}, a:{en:'Israel\'s social security system. Everyone pays from age 18 (even if not working). It funds: old-age pensions, disability benefits, unemployment insurance, maternity leave, and more. Payments are deducted from your salary automatically.',he:'מערכת הביטחון הסוציאלי של ישראל. כולם משלמים מגיל 18 (גם אם לא עובדים). ממנת: קצבת זקנה, נכות, דמי אבטלה, חופשת לידה ועוד. התשלומים מנוכים מהמשכורת אוטומטית.',ar:'نظام الضمان الاجتماعي في إسرائيل. الجميع يدفع من سن 18 (حتى لو لم يعمل). يموّل: معاشات الشيخوخة، إعانات الإعاقة، تأمين البطالة، إجازة الأمومة، وغيرها. تُخصم المدفوعات من الراتب تلقائياً.'}},
  {cat:'work', q:{en:'What should I check on my payslip?',he:'מה לבדוק בתלוש השכר?',ar:'ماذا يجب أن أتحقق في قسيمة الراتب؟'}, a:{en:'Gross salary matches your agreement, income tax and National Insurance deductions look right, pension contributions are there, overtime/bonuses are included, and net pay matches what you received. Mistakes happen — always verify.',he:'שהשכר ברוטו תואם להסכם, שניכויי מס הכנסה וביטוח לאומי נראים נכונים, שיש הפרשות פנסיה, ששעות נוספות/בונוסים כלולים, ושהנטו תואם למה שקיבלתם. טעויות קורות — תמיד לבדוק.',ar:'أن الراتب الإجمالي يطابق اتفاقك، أن خصومات الضرائب والتأمين الوطني صحيحة، أن مساهمات التقاعد موجودة، أن ساعات العمل الإضافية/المكافآت مشمولة، وأن الراتب الصافي يطابق ما استلمته. الأخطاء تحدث — تحقق دائماً.'}},
  {cat:'work', q:{en:'What is minimum wage in Israel?',he:'מה שכר המינימום בישראל?',ar:'ما هو الحد الأدنى للأجور في إسرائيل؟'}, a:{en:'The minimum wage is updated periodically — always check the latest figure on the Ministry of Economy website. It\'s illegal for employers to pay less. If you\'re paid below minimum wage, you can file a complaint with the labor ministry.',he:'שכר המינימום מתעדכן מעת לעת — תמיד בדקו את הנתון העדכני באתר משרד הכלכלה. אסור למעסיק לשלם פחות. אם משלמים לכם מתחת לשכר מינימום, אפשר להגיש תלונה למשרד העבודה.',ar:'يتم تحديث الحد الأدنى للأجور دورياً — تحقق دائماً من أحدث رقم على موقع وزارة الاقتصاد. من غير القانوني أن يدفع صاحب العمل أقل منه. إذا كان راتبك أقل من الحد الأدنى، يمكنك تقديم شكوى لوزارة العمل.'}},
  {cat:'life', q:{en:'What should I know before renting an apartment?',he:'מה חשוב לדעת לפני שכירת דירה?',ar:'ما الذي يجب معرفته قبل استئجار شقة؟'}, a:{en:'Read the full contract before signing. Expect to pay: first month + deposit (often several months or bank guarantee) + broker fee. Check who pays for repairs, what the exit terms are, and whether Arnona and Va\'ad Bayit are included. Get everything in writing.',he:'קראו את כל החוזה לפני חתימה. צפו לשלם: חודש ראשון + פיקדון (לרוב כמה חודשים או ערבות בנקאית) + דמי תיווך. בדקו מי משלם על תיקונים, מה תנאי היציאה, והאם ארנונה וועד בית כלולים. קבלו הכל בכתב.',ar:'اقرأ العقد كاملاً قبل التوقيع. توقع أن تدفع: الشهر الأول + وديعة (غالباً عدة أشهر أو ضمان بنكي) + رسوم وسيط. تحقق من يدفع تكاليف الإصلاحات، ما شروط الخروج، وهل الأرنونا ولجنة المبنى مشمولة. احصل على كل شيء مكتوباً.'}},
  {cat:'life', q:{en:'What is Arnona?',he:'מה זה ארנונה?',ar:'ما هي الأرنونا؟'}, a:{en:'Municipal property tax — you pay it to your city/town based on your apartment size, location, and municipality. Rates vary dramatically between cities. Students, soldiers, and new immigrants may qualify for discounts. Pay on time to avoid penalties.',he:'מס רכוש עירוני — משלמים לעירייה לפי גודל הדירה, מיקום ורשות מקומית. התעריפים משתנים בצורה דרמטית בין ערים. סטודנטים, חיילים ועולים חדשים עשויים לקבל הנחות. שלמו בזמן כדי להימנע מקנסות.',ar:'ضريبة أملاك بلدية — تدفعها لبلديتك حسب حجم الشقة والموقع والبلدية. المعدلات تختلف بشكل كبير بين المدن. الطلاب والجنود والمهاجرون الجدد قد يستحقون تخفيضات. ادفع في الوقت المحدد لتجنب الغرامات.'}},
];

const FAQ_CATS = {
  basics: {en:'Basics',he:'בסיס',ar:'أساسيات'},
  taxes: {en:'Taxes',he:'מיסים',ar:'ضرائب'},
  banking: {en:'Banking',he:'בנקאות',ar:'بنوك'},
  investing: {en:'Investing',he:'השקעות',ar:'استثمار'},
  safety: {en:'Safety',he:'בטיחות',ar:'أمان'},
  work: {en:'Work',he:'עבודה',ar:'عمل'},
  life: {en:'Real Life',he:'חיים אמיתיים',ar:'حياة واقعية'}
};

let modesOpen = false;

function renderModesModal(){
  if(!modesOpen) return '';
  const title = state.lang==='he'?'מצבים':state.lang==='ar'?'الأوضاع':'Modes';
  return `
  <div class="ai-overlay" id="modesOverlay">
    <div class="modes-panel">
      <div class="ai-header">
        <span class="ai-title">⚙️ ${title}</span>
        <button class="ai-close" id="modesCloseBtn">&times;</button>
      </div>
      <div class="modes-body">
        <button class="reallife-toggle ${state.realLifeMode?'active':''}${(state.goalGlow['real-life'] && !state.goalVisited['real-life'])?' glow':''}" id="realLifeToggle">
          <span class="reallife-toggle-label">🇮🇱 ${t('realLifeToggleLabel')}</span>
          <span class="reallife-switch"><span class="reallife-switch-thumb"></span></span>
        </button>
        <button class="quicklearn-toggle ${state.quickLearn?'active':''}" id="quickLearnToggle">
          <span class="reallife-toggle-label">⚡ ${t('quickLearnLabel')}</span>
          <span class="reallife-switch"><span class="reallife-switch-thumb"></span></span>
        </button>
      </div>
    </div>
  </div>`;
}

function renderFaqPanel(){
  if(!faqOpen) return '';
  const title = state.lang==='he'?'שאלות נפוצות':state.lang==='ar'?'أسئلة شائعة':'Common Questions';
  const items = FAQ_DATA.map((faq,i)=>{
    const isOpen = faqExpanded === i;
    const catLabel = FAQ_CATS[faq.cat]?.[state.lang] || faq.cat;
    return `<div class="faq-item ${isOpen?'open':''}" data-faq="${i}">
      <div class="faq-q" data-faq="${i}">
        <span class="faq-cat-tag">${catLabel}</span>
        <span class="faq-q-text">${faq.q[state.lang]}</span>
        <span class="faq-arrow">${isOpen?'▲':'▼'}</span>
      </div>

const LETTERS = ['A','B','C','D'];

function startQuiz(kind, catId, subIdx, topicIdx){
  const cat = findCategory(catId);
  let questions;
  if(kind==='topic'){
    const tp = cat.subs[subIdx].topics[topicIdx];
    questions = QUIZDATA.topics[tp.id][state.lang];
  } else {
    questions = QUIZDATA.subs[catId+':'+subIdx][state.lang];
  }
  state.quiz = { kind, catId, subIdx, topicIdx, questions, qIndex:0, answers: new Array(questions.length).fill(null), submitted:false };
  goto('quiz');
}

function selectQuizAnswer(optIdx){
  state.quiz.answers[state.quiz.qIndex] = optIdx;
  render();
}

function quizNext(){
  if(state.quiz.qIndex < state.quiz.questions.length-1){ state.quiz.qIndex++; render(); }
}
function quizPrev(){
  if(state.quiz.qIndex > 0){ state.quiz.qIndex--; render(); }
}
function quizSubmit(){
  const score = quizScore();
  const total = state.quiz.questions.length;
  let xpGain = score*2;
  const isPerfect = score===total && total>0;
  if(isPerfect){ xpGain += 15; state.hadPerfectQuiz = true; }
  state.quiz.questions.forEach((q,i)=>{
    if(state.quiz.answers[i]===q.c){ state.answerStreak++; state.bestStreak = Math.max(state.bestStreak, state.answerStreak); }
    else state.answerStreak = 0;
  });
  addXP(xpGain);
  state.quiz.xpGained = xpGain;
  state.quiz.submitted = true;
  checkBadges();
  render();
  window.scrollTo(0,0);
}
function quizScore(){
  let score = 0;
  state.quiz.questions.forEach((q,i)=>{ if(state.quiz.answers[i]===q.c) score++; });
  return score;
}

// ===== Compound interest calculator =====
function computeCompound(start, monthly, ratePct, years){
  const monthlyRate = ratePct/100/12;
  let balance = start;
  const compoundSeries = [Math.round(start)];
  for(let y=1;y<=years;y++){
    for(let m=0;m<12;m++){ balance = balance*(1+monthlyRate) + monthly; }
    compoundSeries.push(Math.round(balance));
  }
  const plainSeries = [];
  for(let y=0;y<=years;y++){ plainSeries.push(Math.round(start + monthly*12*y)); }
  return { compoundSeries, plainSeries, compoundTotal: compoundSeries[compoundSeries.length-1], plainTotal: plainSeries[plainSeries.length-1] };
}

function buildGrowthChart(plainSeries, compoundSeries){
  const w=280, h=150, pad=8;
  const maxVal = Math.max(...compoundSeries, 1);
  const n = compoundSeries.length;
  const xStep = (w-pad*2)/(n-1||1);
  const toPoint = (val,i)=>{
    const x = pad + i*xStep;
    const y = h - pad - (val/maxVal)*(h-pad*2);
    return `${x},${y}`;
  };
  const compoundPts = compoundSeries.map((v,i)=>toPoint(v,i)).join(' ');
  const plainPts = plainSeries.map((v,i)=>toPoint(v,i)).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="150">
    <polyline points="${plainPts}" fill="none" stroke="var(--ink-soft)" stroke-width="2" stroke-dasharray="4,4"/>
    <polyline points="${compoundPts}" fill="none" stroke="var(--emerald)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

// ===== Paycheck breakdown calculator =====
function computePaycheck(gross){
  const brackets = [
    {upTo:7010, rate:0.10}, {upTo:10060, rate:0.14}, {upTo:16150, rate:0.20},
    {upTo:22440, rate:0.31}, {upTo:46690, rate:0.35}, {upTo:60130, rate:0.47}, {upTo:Infinity, rate:0.50}
  ];
  let tax=0, prev=0;
  for(const b of brackets){
    if(gross>prev){ tax += (Math.min(gross,b.upTo)-prev)*b.rate; prev=b.upTo; } else break;
  }
  const creditValue = 242*2.25;
  const taxAfterCredits = Math.max(0, tax-creditValue);
  const niThreshold=7522;
  const ni = Math.min(gross,niThreshold)*0.004 + Math.max(0,gross-niThreshold)*0.07;
  const pension = gross*0.06;
  const net = Math.max(0, gross - taxAfterCredits - ni - pension);
  return { tax: Math.round(taxAfterCredits), ni: Math.round(ni), pension: Math.round(pension), net: Math.round(net) };
}

function renderCalcPaycheck(){
  const gross = state.calc.gross;

  const segs = [

  return `

    ${renderTopbar()}

  const sc = getSimScenario(state.sim.round);
  const choice = sc.choices.find(c=>c.id===choiceId);
  if(!choice) return;
  const s = state.sim;
  const eff = choice.effect;
  // Apply effects
  s.savings += (eff.savings||0);
  if(s.savings < 0) s.savings = 0;
  s.invested += (eff.invested||0);
  s.happiness += (eff.happiness||0);
  s.happiness = Math.max(0, Math.min(100, s.happiness));
  s.totalSpent += (eff.spent||0);
  // Flags
  if(eff.flag) s.flags[eff.flag] = true;
  // Salary changes
  if(eff.salaryChange) s.salary += eff.salaryChange;
  if(eff.salaryRoll){
    if(Math.random()<0.5){ s.salary += eff.salaryRoll; s.flags.gotRaise = true; }
    else { s.flags.noRaise = true; }
  }
  // Rent changes
  if(eff.rentChange) s.rent += eff.rentChange;
  // Market boost on investments
  if(eff.marketBoost && s.invested > 0){
    s.invested = Math.round(s.invested * (1 + eff.marketBoost));
  }
  s.totalEarned += sc.salary;
  s.lastChoice = { scenario:sc, choice, effect:eff };
  s.choices.push({month:sc.month, choiceId, choiceEmoji:choice.emoji, choiceLabel:choice.label});
  s.phase = 'result';
  render();
  window.scrollTo(0,0);
}

function continueSim(){
  const s = state.sim;
  if(s.round < getActiveScenarios().length-1){
    s.round++;
    s.phase = 'choice';
    s._twistSeen = false;
  } else {
    s.phase = 'summary';
    s.xpGained = 30;
    addXP(30);
    checkBadges();
  }
  render();
  window.scrollTo(0,0);
}

          <button class="btn-primary" id="simPlayAgainBtn">${t('simPlayAgainBtn')}</button>
          <button class="btn-ghost" id="simBackToolsBtn">${t('simBackToolsBtn')}</button>

  }
}

// ===== Master render =====
function render(){
  document.documentElement.setAttribute('lang', state.lang);
  document.documentElement.setAttribute('dir', dirFor(state.lang));
  let html = '';
  if(state.screen==='login') html = renderLogin();
  else if(state.screen==='goals') html = renderGoals();
  else if(state.screen==='home') html = renderHome();
  else if(state.screen==='category') html = renderCategory();
  else if(state.screen==='lesson') html = renderLesson();
  else if(state.screen==='quiz') html = renderQuiz();
  else if(state.screen==='profile') html = renderProfile();
  else if(state.screen==='calc-compound') html = renderCalcCompound();
  else if(state.screen==='calc-paycheck') html = renderCalcPaycheck();
  else if(state.screen==='simulator') html = renderSimulator();
  document.getElementById('app').innerHTML = html + renderConfirmModal() + renderFaqPanel() + renderModesModal();
  attachEvents();
  saveCurrentProfile();
}

function attachEvents(){
  const confirmModalOk = document.getElementById('confirmModalOk');
  if(confirmModalOk){
    confirmModalOk.addEventListener('click', ()=>{
      const action = state.confirmModal && state.confirmModal.action;
      state.confirmModal = null;
      if(action) action();
      else render();
    });
  }
  const confirmModalCancel = document.getElementById('confirmModalCancel');
  if(confirmModalCancel) confirmModalCancel.addEventListener('click', hideConfirm);
  const confirmModalOverlay = document.getElementById('confirmModalOverlay');
  if(confirmModalOverlay){
    confirmModalOverlay.addEventListener('click', (e)=>{ if(e.target===confirmModalOverlay) hideConfirm(); });
  }

  const langToggle = document.getElementById('langToggle');
  if(langToggle){
    langToggle.addEventListener('click', (e)=>{ e.stopPropagation(); state.langMenuOpen = !state.langMenuOpen; render(); });
  }
  const switchUserBtn = document.getElementById('switchUserBtn');
  if(switchUserBtn){
    switchUserBtn.addEventListener('click', ()=>{
      showConfirm(t('logoutConfirm'), logoutUser);
    });
  }
  const langMenu = document.getElementById('langMenu');
  if(langMenu){
    langMenu.querySelectorAll('.lang-opt').forEach(el=>{
      el.addEventListener('click', ()=> setLang(el.dataset.lang));
    });
  }
  document.querySelectorAll('.mini-lang').forEach(el=>{
    el.addEventListener('click', ()=> setLang(el.dataset.lang));
  });
  document.addEventListener('click', (e)=>{
    if(state.langMenuOpen && !e.target.closest('.topbar-actions')){ state.langMenuOpen=false; render(); }
  }, {once:true});

  // Login screen
  const nameInput = document.getElementById('nameInput');
  if(nameInput){
    nameInput.addEventListener('input', (e)=>{
      state.userName = e.target.value;
      const btn = document.getElementById('startBtn');
      if(btn) btn.disabled = state.userName.trim()==='';
    });
  }
  document.querySelectorAll('.avatar-opt').forEach(el=>{
    el.addEventListener('click', ()=>{ state.avatar = el.dataset.avatar; render(); });
  });
  const startBtn = document.getElementById('startBtn');
  if(startBtn){
    startBtn.addEventListener('click', ()=>{
      if(state.userName.trim()==='') return;
      const hadProfile = loadProfileInto(state.userName);
      state._profileLoaded = true;
      goto(hadProfile ? 'home' : 'goals');
    });
  }

  // Goal picker
  document.querySelectorAll('.goal-card').forEach(el=>{
    el.addEventListener('click', ()=> selectGoal(el.dataset.goal));
  });

  // Home screen
  document.querySelectorAll('.cat-card').forEach(el=>{
    el.addEventListener('click', ()=>{
      const catId = el.dataset.cat;
      if(state.goalGlow[catId]) state.goalVisited[catId] = true;
      goto('category', {activeCategory: catId});
      // completion check runs when user returns to home, so they can browse the category first
    });
  });
  const realLifeCard = document.querySelector('.reallife-featured-card');
  if(realLifeCard) realLifeCard.addEventListener('click', ()=>{
    // Unlike other goals, Real Life only counts as "visited" once every Real Life
    // lesson is finished (checked separately when a lesson is completed) — not
    // just from tapping in.
    goto('category', {activeCategory: realLifeCard.dataset.cat});
  });
  const realLifeToggle = document.getElementById('realLifeToggle');
  if(realLifeToggle) realLifeToggle.addEventListener('click', ()=>{
    state.realLifeMode = !state.realLifeMode;
    modesOpen = false;
    render();
  });
  const quickLearnToggle = document.getElementById('quickLearnToggle');
  if(quickLearnToggle) quickLearnToggle.addEventListener('click', ()=>{
    state.quickLearn = !state.quickLearn;
    modesOpen = false;
    render();
  });
  // Modes modal
  const modesBtn = document.getElementById('modesBtn');
  if(modesBtn) modesBtn.addEventListener('click', ()=>{ modesOpen=true; render(); });
  const modesCloseBtn = document.getElementById('modesCloseBtn');
  if(modesCloseBtn) modesCloseBtn.addEventListener('click', ()=>{ modesOpen=false; render(); });
  const modesOverlay = document.getElementById('modesOverlay');
  if(modesOverlay) modesOverlay.addEventListener('click', (e)=>{ if(e.target===modesOverlay){ modesOpen=false; render(); } });
  const profileBtn = document.getElementById('profileBtn');
  if(profileBtn) profileBtn.addEventListener('click', ()=> goto('profile'));
  // FAQ panel
  const aiChatBtn = document.getElementById('aiChatBtn');
  if(aiChatBtn) aiChatBtn.addEventListener('click', ()=>{ faqOpen=true; faqExpanded=null; render(); });
  const faqCloseBtn = document.getElementById('faqCloseBtn');
  if(faqCloseBtn) faqCloseBtn.addEventListener('click', ()=>{ faqOpen=false; render(); });
  const faqOverlay = document.getElementById('faqOverlay');
  if(faqOverlay) faqOverlay.addEventListener('click', (e)=>{ if(e.target===faqOverlay){ faqOpen=false; render(); } });
  document.querySelectorAll('.faq-q').forEach(el=>{
    el.addEventListener('click', ()=>{
      const idx = parseInt(el.dataset.faq);
      faqExpanded = faqExpanded===idx ? null : idx;
      render();
    });
  });
  const openProfileChip = document.getElementById('openProfileChip');
  if(openProfileChip) openProfileChip.addEventListener('click', ()=> goto('profile'));
  document.querySelectorAll('.tool-card').forEach(el=>{
    el.addEventListener('click', ()=>{
      const kind = el.dataset.tool;
      if(kind==='compound') goto('calc-compound');
      else if(kind==='paycheck') goto('calc-paycheck');
      else if(kind==='sim') startSimulator();
    });
  });

  // Category screen
  const backHome = document.getElementById('backHome');
  if(backHome) backHome.addEventListener('click', ()=> goto('home'));
  document.querySelectorAll('.topic-row').forEach(el=>{
    el.addEventListener('click', ()=>{
      goto('lesson', {activeTopic: {catId: state.activeCategory, subIdx: parseInt(el.dataset.sub), topicIdx: parseInt(el.dataset.topic)}});
    });
  });
  document.querySelectorAll('.subsection-quiz-btn').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      startQuiz('sub', state.activeCategory, parseInt(el.dataset.subQuiz), null);
    });
  });

  // Lesson screen — glossary terms
  document.querySelectorAll('.gl-term').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      document.querySelectorAll('.gl-tooltip').forEach(t=>t.remove());
      const term = el.dataset.term;
      const def = GLOSSARY[state.lang][term] || GLOSSARY[state.lang][term.toLowerCase()] || Object.entries(GLOSSARY[state.lang]).find(([k])=>k.toLowerCase()===term.toLowerCase())?.[1];
      if(!def) return;
      const tip = document.createElement('div');
      tip.className = 'gl-tooltip';
      tip.innerHTML = `<div class="gl-tooltip-term">${term}</div>${def}<button class="gl-tooltip-close" aria-label="close">&times;</button>`;
      document.body.appendChild(tip);
      tip.querySelector('.gl-tooltip-close').addEventListener('click',()=>tip.remove());
      document.addEventListener('click',()=>tip.remove(),{once:true});
    });
  });
  // Lesson screen
  const backCat = document.getElementById('backCat');
  if(backCat) backCat.addEventListener('click', ()=> goto('category', {activeCategory: state.activeTopic.catId}));
  // Step card navigation
  const stepPrev = document.getElementById('stepPrev');
  if(stepPrev) stepPrev.addEventListener('click', ()=>{ if(state.lessonCard>0){ state.lessonCard--; render(); } });
  const stepNext = document.getElementById('stepNext');
  if(stepNext) stepNext.addEventListener('click', ()=>{ state.lessonCard = (state.lessonCard||0)+1; render(); });
  // Swipe support for step cards
  const stepContainer = document.getElementById('stepContainer');
  if(stepContainer){
    let touchStartX = 0;
    stepContainer.addEventListener('touchstart', (e)=>{ touchStartX = e.touches[0].clientX; }, {passive:true});
    stepContainer.addEventListener('touchend', (e)=>{
      const diff = touchStartX - e.changedTouches[0].clientX;
      const isRtl = dirFor(state.lang)==='rtl';
      if(Math.abs(diff) > 50){
        const swipeForward = isRtl ? diff < 0 : diff > 0;
        if(swipeForward){ const el = document.getElementById('stepNext'); if(el && !el.disabled){ state.lessonCard = (state.lessonCard||0)+1; render(); } }
        else { if(state.lessonCard>0){ state.lessonCard--; render(); } }
      }
    }, {passive:true});
  }
  const startTopicQuizBtn = document.getElementById('startTopicQuizBtn');
  if(startTopicQuizBtn){
    startTopicQuizBtn.addEventListener('click', ()=>{
      startQuiz('topic', state.activeTopic.catId, state.activeTopic.subIdx, state.activeTopic.topicIdx);
    });
  }
  const retakeQuizBtn = document.getElementById('retakeQuizBtn');
  if(retakeQuizBtn){
    retakeQuizBtn.addEventListener('click', ()=>{
      startQuiz('topic', state.activeTopic.catId, state.activeTopic.subIdx, state.activeTopic.topicIdx);
    });
  }
  const prevBtn = document.getElementById('prevTopic');
  if(prevBtn){
    prevBtn.addEventListener('click', ()=>{
      const cat = findCategory(state.activeTopic.catId);
      const flat = flatTopicList(cat);
      const curIdx = flat.findIndex(f=>f.sIdx===state.activeTopic.subIdx && f.tIdx===state.activeTopic.topicIdx);
      if(curIdx>0){ const p = flat[curIdx-1]; goto('lesson', {activeTopic:{catId:cat.id, subIdx:p.sIdx, topicIdx:p.tIdx}}); }
    });
  }
  const nextBtn = document.getElementById('nextTopic');
  if(nextBtn){
    nextBtn.addEventListener('click', ()=>{
      const cat = findCategory(state.activeTopic.catId);
      const flat = flatTopicList(cat);
      const curIdx = flat.findIndex(f=>f.sIdx===state.activeTopic.subIdx && f.tIdx===state.activeTopic.topicIdx);
      if(curIdx<flat.length-1){ const n = flat[curIdx+1]; goto('lesson', {activeTopic:{catId:cat.id, subIdx:n.sIdx, topicIdx:n.tIdx}}); }
    });
  }

  // Quiz screen
  const backFromQuiz = document.getElementById('backFromQuiz');
  if(backFromQuiz){
    backFromQuiz.addEventListener('click', ()=>{
      showConfirm(t('quizExitConfirm'), exitQuizToOrigin);
    });
  }
  document.querySelectorAll('.quiz-opt').forEach(el=>{
    el.addEventListener('click', ()=> selectQuizAnswer(parseInt(el.dataset.opt)));
  });
  const quizPrevBtn = document.getElementById('quizPrevBtn');
  if(quizPrevBtn) quizPrevBtn.addEventListener('click', quizPrev);
  const quizNextBtn = document.getElementById('quizNextBtn');
  if(quizNextBtn){
    quizNextBtn.addEventListener('click', ()=>{
      const isLast = state.quiz.qIndex === state.quiz.questions.length-1;
      if(isLast) quizSubmit(); else quizNext();
    });
  }
  const quizMarkCompleteBtn = document.getElementById('quizMarkCompleteBtn');
  if(quizMarkCompleteBtn){
    quizMarkCompleteBtn.addEventListener('click', ()=>{
      const cat = findCategory(state.quiz.catId);
      const tp = cat.subs[state.quiz.subIdx].topics[state.quiz.topicIdx];
      const wasAlreadyDone = !!state.progress[tp.id];
      state.progress[tp.id] = true;
      if(!wasAlreadyDone){ addXP(10); checkBadges(); showToast(t('xpGainedToast',{xp:10}), '✨'); }
      // Real Life goal only counts as "visited" once every Real Life lesson is done.
      if(state.goalGlow['real-life'] && state.quiz.catId === 'real-life'){
        const rlCat = REALLIFE[0];
        if(catTopicIds(rlCat).every(id => state.progress[id])) state.goalVisited['real-life'] = true;
      }
      goto('lesson', {activeTopic:{catId: state.quiz.catId, subIdx: state.quiz.subIdx, topicIdx: state.quiz.topicIdx}});
    });
  }
  const quizRetakeBtn = document.getElementById('quizRetakeBtn');
  if(quizRetakeBtn){
    quizRetakeBtn.addEventListener('click', ()=>{
      startQuiz(state.quiz.kind, state.quiz.catId, state.quiz.subIdx, state.quiz.topicIdx);
    });
  }
  const quizBackBtn = document.getElementById('quizBackBtn');
  if(quizBackBtn){
    quizBackBtn.addEventListener('click', exitQuizToOrigin);
  }

  // Profile screen
  const backHomeFromProfile = document.getElementById('backHomeFromProfile');
  if(backHomeFromProfile) backHomeFromProfile.addEventListener('click', ()=> goto('home'));

  // Calculator screens
  const backHomeFromCalc = document.getElementById('backHomeFromCalc');
  if(backHomeFromCalc) backHomeFromCalc.addEventListener('click', ()=> goto('home'));
  const calcStart = document.getElementById('calcStart');
  if(calcStart) calcStart.addEventListener('input', (e)=>{ state.calc.start = parseInt(e.target.value); render(); });
  const calcMonthly = document.getElementById('calcMonthly');
  if(calcMonthly) calcMonthly.addEventListener('input', (e)=>{ state.calc.monthly = parseInt(e.target.value); render(); });
  const calcRate = document.getElementById('calcRate');
  if(calcRate) calcRate.addEventListener('input', (e)=>{ state.calc.rate = parseFloat(e.target.value); render(); });
  const calcYears = document.getElementById('calcYears');
  if(calcYears) calcYears.addEventListener('input', (e)=>{ state.calc.years = parseInt(e.target.value); render(); });
  const calcGross = document.getElementById('calcGross');
  if(calcGross) calcGross.addEventListener('input', (e)=>{ state.calc.gross = parseInt(e.target.value); render(); });

  // Simulator screen
  const backHomeFromSim = document.getElementById('backHomeFromSim');
  if(backHomeFromSim) backHomeFromSim.addEventListener('click', ()=> goto('home'));
  // Scenario picker cards
  document.querySelectorAll('.sim-picker-card').forEach(el=>{
    el.addEventListener('click', ()=> pickSimScenario(el.dataset.simType));
  });
  const simIntroBtn = document.getElementById('simIntroBtn');
  if(simIntroBtn) simIntroBtn.addEventListener('click', ()=>{ state.sim.phase='choice'; state.sim._twistSeen=false; render(); window.scrollTo(0,0); });
  // Plot twist popup — delayed entrance then auto-dismiss
  const twistOverlay = document.getElementById('simTwistOverlay');
  if(twistOverlay){
    const dur = parseInt(twistOverlay.dataset.twistDur,10)*1000||7000;
    const delay = parseInt(twistOverlay.dataset.twistDelay,10)||2000;
    const dismissTwist = ()=>{
      if(twistOverlay._dismissed) return;
      twistOverlay._dismissed = true;
      twistOverlay.classList.add('closing');
      state.sim._twistSeen = true;
      setTimeout(()=>{ twistOverlay.remove(); },400);
    };
    // Show popup after delay so player can read the month context first
    twistOverlay._showTimer = setTimeout(()=>{
      twistOverlay.classList.add('visible');
      twistOverlay.addEventListener('click', dismissTwist);
      twistOverlay._timer = setTimeout(dismissTwist, dur);
    }, delay);
  }
  document.querySelectorAll('.sim-action-btn').forEach(el=>{
    el.addEventListener('click', ()=> chooseSimAction(el.dataset.simAction));
  });
  const simContinueBtn = document.getElementById('simContinueBtn');
  if(simContinueBtn) simContinueBtn.addEventListener('click', continueSim);
  const simPlayAgainBtn = document.getElementById('simPlayAgainBtn');
  if(simPlayAgainBtn) simPlayAgainBtn.addEventListener('click', ()=> startSimulator());
  const simBackToolsBtn = document.getElementById('simBackToolsBtn');
  if(simBackToolsBtn) simBackToolsBtn.addEventListener('click', ()=> goto('home'));
}

function exitQuizToOrigin(){
  if(state.quiz.kind==='topic'){
    goto('lesson', {activeTopic:{catId: state.quiz.catId, subIdx: state.quiz.subIdx, topicIdx: state.quiz.topicIdx}});
  } else {
    goto('category', {activeCategory: state.quiz.catId});
  }
}

// Prefill the last-used name on a genuine fresh page load only (not after an in-session logout).
const __lastUser = getLastUser();
if(__lastUser) state.userName = __lastUser;

render();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js?v=32').catch(() => {
      // Registration can fail if not served over https/localhost, or files aren't hosted alongside this one — app still works without it.
    });
  });
}
</script>
</body>
</html>
