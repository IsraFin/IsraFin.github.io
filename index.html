<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>IsraFin</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F4A38">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IsraFin">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Rubik:wght@400;500;600;700&family=Cairo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg: #F3F6F3;
  --paper: #FFFFFF;
  --ink: #16231D;
  --ink-soft: #4B5A52;
  --line: #DEE6DF;
  --emerald: #1F7A5C;
  --emerald-deep: #145940;
  --gold: #E8A33D;
  --gold-deep: #B87D1F;
  --brick: #B0473A;
  --radius-lg: 22px;
  --radius-md: 16px;
  --radius-sm: 10px;
  --shadow-sm: 0 1px 2px rgba(22,35,29,0.06), 0 1px 1px rgba(22,35,29,0.04);
  --shadow-md: 0 8px 24px rgba(22,35,29,0.10), 0 2px 6px rgba(22,35,29,0.06);
  --shadow-lg: 0 20px 50px rgba(22,35,29,0.16), 0 6px 16px rgba(22,35,29,0.08);
  --font-display: 'Heebo', 'Cairo', sans-serif;
  --font-body: 'Rubik', 'Cairo', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}
[dir="rtl"]{ --font-display: 'Heebo', sans-serif; --font-body: 'Rubik', sans-serif; }
html[lang="ar"]{ --font-display: 'Cairo', sans-serif; --font-body: 'Cairo', sans-serif; }
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
  min-height:100vh;
  overflow-x:hidden;
}
#app{max-width:560px; margin:0 auto; min-height:100vh; position:relative; padding-bottom:40px;}
button{font-family:inherit; cursor:pointer;}
a{color:inherit;}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}

/* ===== Topbar ===== */
.topbar{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 18px;
  background: rgba(243,246,243,0.86);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.brand{display:flex; align-items:center; gap:9px; font-family:var(--font-display); font-weight:800; font-size:19px; letter-spacing:-0.02em;}
.brand-coin{
  width:30px; height:30px; border-radius:50%;
  background: linear-gradient(155deg, var(--gold) 0%, var(--gold-deep) 100%);
  display:flex; align-items:center; justify-content:center;
  font-size:15px; color:#fff; font-weight:800; box-shadow: inset 0 -2px 3px rgba(0,0,0,0.18), 0 2px 4px rgba(184,125,31,0.4);
}
.topbar-actions{display:flex; align-items:center; gap:8px;}
.icon-btn{
  width:38px; height:38px; border-radius:50%;
  border:1px solid var(--line); background:var(--paper);
  display:flex; align-items:center; justify-content:center;
  font-size:15px; color:var(--ink); transition: transform .15s ease, box-shadow .15s ease;
}
.icon-btn:hover{ box-shadow: var(--shadow-sm); transform: translateY(-1px); }
.lang-pill{
  display:flex; align-items:center; gap:5px;
  border:1px solid var(--line); background:var(--paper);
  border-radius:999px; padding:7px 12px; font-size:13px; font-weight:600;
}
.lang-menu{
  position:absolute; top:56px; inset-inline-end:18px; z-index:50;
  background:var(--paper); border-radius:var(--radius-md); box-shadow:var(--shadow-lg);
  border:1px solid var(--line); overflow:hidden; min-width:160px;
  display:none;
}
.lang-menu.open{display:block;}
.lang-opt{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:12px 16px; font-size:14px; font-weight:500; border-bottom:1px solid var(--line);
}
.lang-opt:last-child{border-bottom:none;}
.lang-opt:hover{background:var(--bg);}
.lang-opt.active{color:var(--emerald-deep); font-weight:700;}

/* ===== Goal Picker ===== */
.goals-header{ text-align:center; padding:60px 24px 24px; }
.goals-title{ font-size:22px; font-weight:800; color:var(--ink); margin-bottom:6px; }
.goals-sub{ font-size:14px; color:var(--muted); }
.goals-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:0 20px 40px; }
.goal-congrats{ margin:0 20px 20px; padding:16px 18px; border-radius:var(--radius-lg); background: linear-gradient(135deg, #ECFDF5, #F0FDF4); border:1.5px solid #86EFAC; text-align:center; }
.goal-congrats-emoji{ font-size:30px; margin-bottom:6px; }
.goal-congrats-text{ font-weight:700; font-size:14px; color:#166534; }
.goal-card{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
  padding:24px 12px; border-radius:var(--radius-lg); border:1.5px solid var(--line);
  background:var(--paper); transition: box-shadow .2s ease, transform .15s ease;
}
.goal-card:hover{ box-shadow:var(--shadow-md); transform:translateY(-2px); }
.goal-emoji{ font-size:32px; }
.goal-label{ font-size:14px; font-weight:700; color:var(--ink); text-align:center; }

/* ===== Glow effect ===== */
@keyframes glowPulse {
  0%, 100% { box-shadow: 0 0 8px 2px rgba(31,122,92,0.35); }
  50% { box-shadow: 0 0 16px 5px rgba(31,122,92,0.55); }
}
.cat-card.glow, .reallife-toggle.glow {
  animation: glowPulse 2s ease-in-out infinite;
  border-color: var(--accent-deep, var(--emerald-deep));
}

/* ===== Confirm Modal ===== */
.modal-overlay{
  position:fixed; inset:0; z-index:100;
  background:rgba(22,35,29,0.45);
  display:flex; align-items:center; justify-content:center;
  padding:20px;
}
.modal-card{
  background:var(--paper); border-radius:var(--radius-lg); box-shadow:var(--shadow-lg);
  padding:24px 22px; max-width:360px; width:100%; text-align:start;
}
.modal-message{ font-size:15px; line-height:1.5; color:var(--ink); margin-bottom:20px; }
.modal-actions{ display:flex; gap:10px; }
.modal-actions .btn-ghost, .modal-actions .btn-primary{ flex:1; }

/* ===== Screens ===== */
.screen{ display:none; animation: fadeUp .35s ease; }
.screen.active{display:block;}
@keyframes fadeUp{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
@media (prefers-reduced-motion: reduce){ .screen{animation:none;} }

/* ===== Login ===== */
.login-wrap{ padding:26px 22px 10px; text-align:center; }
.login-hero{ display:flex; justify-content:center; margin: 8px 0 6px; }
.login-title{ font-family:var(--font-display); font-weight:800; font-size:30px; letter-spacing:-0.02em; margin:6px 0 4px; }
.login-tag{ color:var(--ink-soft); font-size:15px; line-height:1.5; max-width:340px; margin:0 auto 26px; }
.login-card{
  background:var(--paper); border-radius:var(--radius-lg); box-shadow:var(--shadow-md);
  padding:24px 22px 22px; text-align:start; border:1px solid var(--line);
}
.field-label{ font-size:13px; font-weight:700; color:var(--ink-soft); margin-bottom:8px; display:block; text-transform:uppercase; letter-spacing:.04em; }
.field-input{
  width:100%; padding:14px 16px; border-radius:var(--radius-sm); border:1.5px solid var(--line);
  font-size:16px; font-family:inherit; background:var(--bg); color:var(--ink); margin-bottom:16px;
  transition: border-color .15s ease;
}
.field-input:focus{ outline:none; border-color:var(--emerald); background:var(--paper); }
.avatar-row{ display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap; }
.avatar-opt{
  width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:20px; border:2px solid transparent; background:var(--bg);
}
.avatar-opt.selected{ border-color: var(--emerald); background:#E4F1EB; }
.btn-primary{
  width:100%; padding:15px; border-radius:999px; border:none;
  background: linear-gradient(135deg, var(--emerald) 0%, var(--emerald-deep) 100%);
  color:#fff; font-weight:700; font-size:16px; box-shadow: 0 6px 18px rgba(31,122,92,0.32);
  transition: transform .12s ease;
}
.btn-primary:hover{ transform: translateY(-1px); }
.btn-primary:active{ transform: translateY(0); }
.btn-primary:disabled{ opacity:.5; box-shadow:none; }
.login-note{ font-size:12.5px; color:var(--ink-soft); margin-top:14px; line-height:1.5; }
.login-langs{ display:flex; justify-content:center; gap:8px; margin-bottom:22px; }
.mini-lang{
  padding:7px 14px; border-radius:999px; border:1.5px solid var(--line); background:var(--paper);
  font-size:13px; font-weight:600; color:var(--ink-soft);
}
.mini-lang.active{ background:var(--ink); color:#fff; border-color:var(--ink); }

/* growth sprite */
.sprite{ width:120px; height:100px; }
.coin{ transform-origin:center; }
.sprite .c1{ animation: rise .9s ease .1s both; }
.sprite .c2{ animation: rise .9s ease .28s both; }
.sprite .c3{ animation: rise .9s ease .46s both; }
.sprite .c4{ animation: rise .9s ease .64s both; }
.sprite .leaf{ animation: pop .5s ease .95s both; transform-origin: 60px 30px; }
@keyframes rise{ from{ transform: translateY(14px) scale(.7); opacity:0;} to{ transform:translateY(0) scale(1); opacity:1;} }
@keyframes pop{ from{ transform: scale(0) rotate(-20deg); opacity:0;} to{ transform: scale(1) rotate(0deg); opacity:1;} }
@media (prefers-reduced-motion: reduce){ .sprite *{animation:none !important;} }

/* ===== Home ===== */
.home-header{ padding:20px 20px 4px; }
.greeting{ font-family:var(--font-display); font-weight:800; font-size:24px; letter-spacing:-0.02em; }
.greeting-sub{ color:var(--ink-soft); font-size:14.5px; margin-top:4px; }
.progress-band{
  margin:16px 20px 6px; padding:16px 18px; border-radius:var(--radius-md);
  background: linear-gradient(120deg, var(--emerald-deep), var(--emerald));
  color:#fff; display:flex; align-items:center; justify-content:space-between; box-shadow: var(--shadow-md);
}
.progress-band .num{ font-family:var(--font-mono); font-size:26px; font-weight:700; }
.progress-band .lbl{ font-size:12.5px; opacity:.85; margin-top:2px; }
.progress-ring-wrap{ width:52px; height:52px; }

.grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; padding:18px 20px 10px; }
@media (max-width:380px){ .grid{grid-template-columns:1fr;} }
.cat-card{
  background:var(--paper); border-radius:var(--radius-md); padding:16px 15px;
  box-shadow:var(--shadow-sm); border:1px solid var(--line); text-align:start;
  display:flex; flex-direction:column; gap:10px; min-height:132px; position:relative; overflow:hidden;
  transition: transform .15s ease, box-shadow .15s ease;
}
.cat-card:hover{ transform: translateY(-2px); box-shadow: var(--shadow-md); }
.cat-card::before{
  content:''; position:absolute; inset-inline-end:-18px; top:-18px; width:70px; height:70px; border-radius:50%;
  background: var(--accent); opacity:.12;
}
.cat-icon{ width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:19px; background: var(--accent); box-shadow: var(--shadow-sm); }
.cat-name{ font-family:var(--font-display); font-weight:700; font-size:14.5px; line-height:1.28; }
.cat-meta{ font-size:11.5px; color:var(--ink-soft); font-family:var(--font-mono); margin-top:auto; display:flex; align-items:center; justify-content:space-between; }
.cat-bar{ height:4px; border-radius:4px; background:var(--line); overflow:hidden; margin-top:2px;}
.cat-bar-fill{ height:100%; background:var(--accent); border-radius:4px; transition: width .4s ease; }

.footnote{ padding:22px 26px 10px; font-size:12px; color:var(--ink-soft); text-align:center; line-height:1.6; }
.support-card{ margin:8px 20px 4px; padding:18px; border-radius:var(--radius-md); background:var(--surface); border:1px solid var(--border); text-align:center; }
.support-text{ font-size:13.5px; color:var(--ink-soft); line-height:1.5; margin-bottom:12px; }
.support-email{ display:inline-block; font-size:14px; font-weight:700; color:var(--brand); text-decoration:none; padding:8px 18px; border:1.5px solid var(--brand); border-radius:10px; transition:all .15s; }
.support-email:active{ background:#16A34A; color:#fff; }
.fact-card{ margin:18px 20px 4px; padding:16px 18px; border-radius:var(--radius-md); background:linear-gradient(135deg,#FFFBEB,#FEF3C7); border:1px solid #FDE68A; }
.fact-label{ font-size:12px; font-weight:800; color:#92400E; text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px; }
.fact-text{ font-size:13.5px; color:#78350F; line-height:1.5; }
.gl-term{ color:var(--brand); text-decoration:underline; text-decoration-style:dotted; text-underline-offset:3px; cursor:pointer; font-weight:600; }
.gl-tooltip{ position:fixed; left:50%; transform:translateX(-50%); bottom:32px; max-width:320px; width:calc(100% - 40px); background:var(--ink); color:#fff; padding:14px 18px; border-radius:14px; font-size:13.5px; line-height:1.5; z-index:999; box-shadow:0 8px 30px rgba(0,0,0,.25); animation:glPop .2s ease; }
.gl-tooltip-term{ font-weight:800; font-size:14px; margin-bottom:4px; color:#B4F0C8; }
.gl-tooltip-close{ position:absolute; top:8px; right:12px; background:none; border:none; color:#fff; font-size:18px; cursor:pointer; opacity:.7; }
@keyframes glPop{ from{opacity:0;transform:translateX(-50%) translateY(10px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }
.step-dots{ display:flex; gap:6px; justify-content:center; margin:14px 0 18px; }
.step-dot{ width:8px; height:8px; border-radius:50%; background:var(--border); transition:all .2s; }
.step-dot.active{ background:var(--brand); transform:scale(1.3); }
.step-dot.done{ background:var(--brand); opacity:.45; }
.step-container{ min-height:140px; }
.step-card{ animation:stepIn .25s ease; text-align:center; padding:12px 4px; }
.step-emoji{ font-size:36px; margin-bottom:12px; }
.step-body{ font-size:16px; line-height:1.7; color:var(--ink); }
.step-label{ font-size:17px; font-weight:700; color:var(--ink); margin-bottom:18px; }
.quiz-step{ padding:24px 4px; }
.step-nav{ display:flex; align-items:center; justify-content:space-between; margin-top:18px; padding-top:14px; border-top:1px solid var(--border); }
.step-btn{ width:44px; height:44px; border-radius:50%; border:1.5px solid var(--border); background:var(--surface); font-size:20px; font-weight:700; color:var(--ink); cursor:pointer; display:flex; align-items:center; justify-content:center; }
.step-btn.primary{ background:var(--brand); color:#fff; border-color:var(--brand); }
.step-btn:disabled{ opacity:.25; cursor:default; }
.step-counter{ font-size:13px; color:var(--ink-soft); font-weight:600; }
@keyframes stepIn{ from{opacity:0;transform:translateX(30px)} to{opacity:1;transform:translateX(0)} }

/* ===== Category screen ===== */
.subhead{ display:flex; align-items:center; gap:12px; padding:16px 18px 6px; }
.back-btn{
  width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:var(--paper);
  display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0;
}
.cat-title-row{ display:flex; align-items:center; gap:10px; }
.cat-title-icon{ width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:20px; background:var(--accent); }
.cat-title{ font-family:var(--font-display); font-weight:800; font-size:19px; letter-spacing:-0.01em; }
.cat-sub-count{ font-size:12.5px; color:var(--ink-soft); font-family:var(--font-mono); }

.subsection{ margin: 18px 18px 0; }
.subsection-name{
  font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--accent-deep);
  margin-bottom:10px; display:flex; align-items:center; gap:8px;
}
.subsection-name::after{ content:''; flex:1; height:1px; background:var(--line); }
.topic-list{ display:flex; flex-direction:column; gap:8px; margin-bottom:6px; }
.topic-row{
  display:flex; align-items:center; gap:12px; background:var(--paper); border:1px solid var(--line);
  border-radius:var(--radius-sm); padding:13px 14px; text-align:start; box-shadow: var(--shadow-sm);
  transition: transform .12s ease, border-color .12s ease;
}
.topic-row:hover{ transform: translateX(2px); border-color: var(--accent); }
[dir="rtl"] .topic-row:hover{ transform: translateX(-2px); }
.topic-check{
  width:24px; height:24px; border-radius:50%; border:2px solid var(--line); flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-size:12px; color:#fff;
}
.topic-check.done{ background: var(--emerald); border-color:var(--emerald); }
.topic-title{ font-size:14.5px; font-weight:500; line-height:1.35; flex:1; }
.lv-badge{ display:inline-block; font-size:10px; font-weight:700; padding:2px 7px; border-radius:999px; margin-inline-start:8px; vertical-align:middle; letter-spacing:.02em; }
.lv-beginner{ background:#ECFDF5; color:#166534; }
.lv-intermediate{ background:#FEF3C7; color:#92400E; }
.lv-advanced{ background:#FEE2E2; color:#991B1B; }
.topic-arrow{ color:var(--ink-soft); font-size:13px; opacity:.6; flex-shrink:0; }

/* ===== Lesson screen ===== */
.lesson-top{ display:flex; align-items:center; justify-content:space-between; padding:16px 18px 0; }
.lesson-crumb{ font-size:12px; color:var(--ink-soft); font-family:var(--font-mono); padding:0 22px; margin-top:14px; }
.lesson-card{
  margin:14px 18px 0; background:var(--paper); border-radius:var(--radius-lg); box-shadow:var(--shadow-md);
  border:1px solid var(--line); padding:26px 24px 24px; position:relative; overflow:hidden;
}
.lesson-card::before{
  content:''; position:absolute; inset-inline-start:0; top:0; bottom:0; width:5px; background:var(--accent);
}
.lesson-title{ font-family:var(--font-display); font-weight:800; font-size:22px; line-height:1.28; letter-spacing:-0.01em; margin-bottom:14px; }
.lesson-body{ font-size:16px; line-height:1.75; color:#26332C; }
.lesson-mark{
  margin-top:22px; display:flex; align-items:center; gap:10px; padding:12px 16px; border-radius:999px;
  border:1.5px solid var(--line); background:var(--bg); font-weight:600; font-size:14px; width:100%; justify-content:center;
}
.lesson-mark.done{ background: #E4F1EB; border-color: var(--emerald); color:var(--emerald-deep); }
.lesson-nav{ display:flex; gap:10px; padding:16px 18px 4px; }
.nav-btn{
  flex:1; padding:14px; border-radius:var(--radius-sm); border:1px solid var(--line); background:var(--paper);
  font-weight:600; font-size:13.5px; display:flex; align-items:center; justify-content:center; gap:6px;
  box-shadow: var(--shadow-sm);
}
.nav-btn:disabled{ opacity:.35; }
.nav-btn.primary{ background: var(--ink); color:#fff; border-color:var(--ink); }

/* language wrapper direction utility */
[dir="rtl"] .icon-flip{ transform: scaleX(-1); }

/* ===== Quiz ===== */
.quiz-progress-row{ display:flex; gap:6px; padding:16px 18px 0; }
.quiz-dot{ flex:1; height:5px; border-radius:4px; background:var(--line); }
.quiz-dot.filled{ background: var(--accent-deep); }
.quiz-card{
  margin:16px 18px 0; background:var(--paper); border-radius:var(--radius-lg); box-shadow:var(--shadow-md);
  border:1px solid var(--line); padding:24px 22px; position:relative; overflow:hidden;
}
.quiz-card::before{ content:''; position:absolute; inset-inline-start:0; top:0; bottom:0; width:5px; background:var(--accent-deep); }
.quiz-qnum{ font-size:12px; font-weight:700; color:var(--accent-deep); font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.05em; margin-bottom:10px; }
.quiz-question{ font-family:var(--font-display); font-weight:800; font-size:19px; line-height:1.35; margin-bottom:18px; }
.quiz-options{ display:flex; flex-direction:column; gap:10px; }
.quiz-opt{
  text-align:start; padding:14px 16px; border-radius:var(--radius-sm); border:1.5px solid var(--line);
  background:var(--bg); font-size:14.5px; font-weight:500; line-height:1.4; display:flex; align-items:center; gap:12px;
  transition: border-color .12s ease, background .12s ease;
}
.quiz-opt-letter{
  width:26px; height:26px; border-radius:50%; border:1.5px solid var(--line); flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; font-family:var(--font-mono); background:var(--paper);
}
.quiz-opt.selected{ border-color: var(--accent-deep); background: color-mix(in srgb, var(--accent-deep) 10%, var(--paper)); }
.quiz-opt.selected .quiz-opt-letter{ background: var(--accent-deep); color:#fff; border-color:var(--accent-deep); }
.quiz-nav-row{ display:flex; gap:10px; padding:18px 18px 4px; }
.quiz-results{ text-align:center; padding:8px 6px; }
.quiz-score-ring{ margin:6px auto 14px; }
.quiz-score-num{ font-family:var(--font-display); font-weight:800; font-size:32px; }
.quiz-score-lbl{ font-size:14px; color:var(--ink-soft); margin-bottom:20px; }

/* Plot Twist Popup */
.sim-twist-overlay{ position:fixed; inset:0; z-index:9999; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.55); backdrop-filter:blur(4px); opacity:0; pointer-events:none; }

.sim-twist-box::before{ content:''; position:absolute; top:-60%; left:-60%; width:220%; height:220%; background:radial-gradient(circle,rgba(255,199,0,.12) 0%,transparent 60%); pointer-events:none; }
.sim-twist-icon{ font-size:44px; margin-bottom:10px; filter:drop-shadow(0 4px 12px rgba(0,0,0,.3)); animation:twistBounce .6s ease-out; }

.sim-twist-timer{ position:absolute; bottom:0; left:0; height:3px; background:linear-gradient(90deg,#FFC700,#FF6B6B); border-radius:0 0 20px 20px; animation:twistTimer var(--twist-duration,7s) linear forwards; animation-play-state:paused; }

@keyframes twistFadeIn{ from{opacity:0} to{opacity:1} }

<script>
const DATA = [
{id:'basics', icon:'🧠', color:'#3A5A78', name:{en:'Financial Basics', he:'יסודות פיננסיים', ar:'الأساسيات المالية'},
 subs:[
  {name:{en:'The Building Blocks', he:'אבני היסוד', ar:'اللبنات الأساسية'}, topics:[
   {id:'income',lv:1, en:{t:`What Is Income?`,b:`Income is money you receive — from a job, an allowance, a gift, or a business. Knowing your income is the first step to managing money well, because you can only budget what you actually have.`}, he:{t:`מהי הכנסה?`,b:`הכנסה היא כסף שאתם מקבלים — ממשכורת, דמי כיס, מתנה או עסק. הכרת ההכנסה שלכם היא הצעד הראשון לניהול כסף נכון, כי אפשר לתקצב רק את מה שבאמת יש לכם.`}, ar:{t:`ما هو الدخل؟`,b:`الدخل هو المال الذي تحصل عليه — من عمل، أو مصروف جيب، أو هدية، أو مشروع. معرفة دخلك هي الخطوة الأولى لإدارة المال بشكل جيد، لأنك تستطيع فقط وضع ميزانية لما تملكه فعلاً.`}},
   {id:'expenses',lv:1, en:{t:`What Are Expenses?`,b:`Expenses are everything you spend money on — bus fare, snacks, games, clothes. Tracking your expenses shows you exactly where your money goes, which is the only way to spend on purpose instead of by accident.`}, he:{t:`מהן הוצאות?`,b:`הוצאות הן כל דבר שאתם מוציאים עליו כסף — נסיעות באוטובוס, חטיפים, משחקים, בגדים. מעקב אחר ההוצאות מראה לכם בדיוק לאן הכסף שלכם הולך, וזו הדרך היחידה להוציא כסף במודע ולא בטעות.`}, ar:{t:`ما هي المصروفات؟`,b:`المصروفات هي كل ما تنفق عليه المال — أجرة الحافلة، الوجبات الخفيفة، الألعاب، الملابس. تتبّع مصروفاتك يُظهر لك بالضبط إلى أين يذهب مالك، وهذه هي الطريقة الوحيدة للإنفاق بوعي بدلاً من الصدفة.`}},
   {id:'budgeting',lv:1, en:{t:`What Is Budgeting?`,b:`A budget is a simple plan for your money — how much comes in, and how much goes out to spending, saving, and giving. Even a basic budget helps you avoid running out of money before your next income arrives.`}, he:{t:`מהו תקציב?`,b:`תקציב הוא תוכנית פשוטה לכסף שלכם — כמה נכנס וכמה יוצא להוצאות, לחיסכון ולתרומה. גם תקציב בסיסי עוזר להימנע מלהיגמר לכם הכסף לפני שההכנסה הבאה מגיעה.`}, ar:{t:`ما هي الميزانية؟`,b:`الميزانية هي خطة بسيطة لمالك — كم يدخل وكم يخرج للإنفاق والادخار والعطاء. حتى الميزانية البسيطة تساعدك على تجنّب نفاد المال قبل وصول دخلك التالي.`}}
  ]},
  {name:{en:'Core Ideas', he:'רעיונות מרכזיים', ar:'الأفكار الأساسية'}, topics:[
   {id:'saving-overview',lv:1, en:{t:`What Is Saving?`,b:`Saving means setting money aside now so you can use it later instead of spending it today. It's how you build toward goals — big or small — without relying on debt.`}, he:{t:`מהו חיסכון?`,b:`חיסכון הוא הפרשת כסף בצד עכשיו כדי להשתמש בו מאוחר יותר במקום להוציא אותו היום. כך בונים לקראת מטרות — גדולות או קטנות — בלי להסתמך על חוב.`}, ar:{t:`ما هو الادخار؟`,b:`الادخار يعني تخصيص المال جانباً الآن لاستخدامه لاحقاً بدلاً من إنفاقه اليوم. بهذه الطريقة تبني نحو أهدافك — كبيرة كانت أو صغيرة — دون الاعتماد على الديون.`}},
   {id:'investing-overview',lv:1, en:{t:`What Is Investing?`,b:`Investing means putting your money into something — like stocks or a fund — with the goal of growing it over time. Unlike saving, investing carries risk, but it also gives your money the chance to grow faster than inflation.`}, he:{t:`מהי השקעה?`,b:`השקעה היא הכנסת כסף למשהו — כמו מניות או קרן — במטרה להגדיל אותו לאורך זמן. בניגוד לחיסכון, בהשקעה יש סיכון, אבל היא גם נותנת לכסף שלכם סיכוי לגדול מהר יותר מהאינפלציה.`}, ar:{t:`ما هو الاستثمار؟`,b:`الاستثمار يعني وضع مالك في شيء ما — مثل الأسهم أو صندوق استثماري — بهدف تنميته مع مرور الوقت. على عكس الادخار، الاستثمار ينطوي على مخاطرة، لكنه أيضاً يمنح مالك فرصة النمو أسرع من التضخم.`}},
   {id:'interest-overview',lv:1, en:{t:`What Is Interest?`,b:`Interest is the price of money — it's what a bank pays you for keeping your savings with them, or what you pay when you borrow money. Understanding interest helps you see why saving early, and borrowing carefully, both matter.`}, he:{t:`מהי ריבית?`,b:`ריבית היא "מחיר" הכסף — זה מה שהבנק משלם לכם על שמירת החיסכון אצלו, או מה שאתם משלמים כשאתם לווים כסף. הבנת הריבית עוזרת לראות למה חשוב לחסוך מוקדם וללוות בזהירות.`}, ar:{t:`ما هي الفائدة؟`,b:`الفائدة هي "ثمن" المال — وهي ما يدفعه لك البنك مقابل الاحتفاظ بمدخراتك لديه، أو ما تدفعه عندما تقترض مالاً. فهم الفائدة يساعدك على إدراك أهمية الادخار مبكراً والاقتراض بحذر.`}},
   {id:'inflation-overview',lv:1, en:{t:`What Is Inflation?`,b:`Inflation is when prices rise over time, so the same amount of money buys less than it used to. That's why ₪100 today won't buy as much in ten years — and why keeping money productive matters.`}, he:{t:`מהי אינפלציה?`,b:`אינפלציה היא עלייה במחירים לאורך זמן, כך שאותו סכום כסף קונה פחות ממה שקנה בעבר. זו הסיבה ש-100 ₪ היום לא יקנו את אותו הדבר בעוד עשר שנים — ולמה חשוב לגרום לכסף לעבוד.`}, ar:{t:`ما هو التضخم؟`,b:`التضخم هو ارتفاع الأسعار مع مرور الوقت، بحيث يشتري نفس المبلغ من المال أقل مما كان يشتريه سابقاً. لهذا السبب لن يشتري 100 شيكل اليوم نفس الأشياء بعد عشر سنوات — ولهذا يهم أن يبقى المال يعمل.`}}
  ]},
  {name:{en:'Risk & Debt', he:'סיכון וחוב', ar:'المخاطر والديون'}, topics:[
   {id:'risk',lv:1, en:{t:`What Is Risk?`,b:`Risk is the chance that something won't go as planned — like an investment losing value. Every financial choice involves some risk, so learning to recognize and manage it is more useful than trying to avoid it completely.`}, he:{t:`מהו סיכון?`,b:`סיכון הוא הסיכוי שמשהו לא יתנהל כמתוכנן — כמו השקעה שמאבדת מערכה. בכל החלטה פיננסית יש סיכון מסוים, ולכן ללמוד לזהות ולנהל אותו שימושי יותר מלנסות להימנע ממנו לגמרי.`}, ar:{t:`ما هي المخاطرة؟`,b:`المخاطرة هي احتمال ألا يسير شيء كما هو مخطط له — مثل استثمار يفقد قيمته. كل قرار مالي ينطوي على قدر من المخاطرة، لذا فإن تعلّم التعرف عليها وإدارتها أفيد من محاولة تجنبها تماماً.`}},
   {id:'debt',lv:1, en:{t:`What Is Debt?`,b:`Debt is money you owe to someone else — a bank, a store, or a person — usually with interest added on top. Some debt (like a mortgage) can be reasonable; other debt (like high-interest credit) can trap you if you're not careful.`}, he:{t:`מהו חוב?`,b:`חוב הוא כסף שאתם חייבים למישהו אחר — בנק, חנות או אדם — בדרך כלל עם ריבית שמתווספת עליו. חוב מסוים (כמו משכנתא) יכול להיות סביר; חוב אחר (כמו אשראי בריבית גבוהה) עלול ללכוד אתכם אם לא נזהרים.`}, ar:{t:`ما هو الدين؟`,b:`الدين هو مال تدين به لجهة أخرى — بنك أو متجر أو شخص — عادةً مع فائدة تُضاف عليه. بعض الديون (مثل قرض الرهن العقاري) يمكن أن تكون معقولة؛ ديون أخرى (مثل الائتمان مرتفع الفائدة) قد تُوقعك في فخ إذا لم تكن حذراً.`}},
   {id:'assets-liabilities',lv:2, en:{t:`Assets vs. Liabilities`,b:`An asset is something that puts money in your pocket or grows in value, like savings or stocks. A liability is something that costs you money, like a loan. Building wealth means growing your assets faster than your liabilities.`}, he:{t:`נכסים מול התחייבויות`,b:`נכס הוא משהו שמכניס לכם כסף לכיס או עולה בערכו, כמו חיסכון או מניות. התחייבות היא משהו שעולה לכם כסף, כמו הלוואה. בניית עושר משמעה לגדל את הנכסים מהר יותר מההתחייבויות.`}, ar:{t:`الأصول مقابل الالتزامات`,b:`الأصل هو شيء يضع مالاً في جيبك أو يزداد قيمة، مثل المدخرات أو الأسهم. الالتزام هو شيء يكلفك مالاً، مثل القرض. بناء الثروة يعني تنمية أصولك أسرع من التزاماتك.`}}
  ]},
  {name:{en:'Growing & Talking Money', he:'לגדל כסף ולדבר את השפה', ar:'تنمية المال ولغته'}, topics:[
   {id:'compound-interest',lv:2, en:{t:`Compound Interest`,b:`Compound interest means you earn interest not just on your original money, but also on the interest it already earned. Over many years, this "snowball effect" is one of the most powerful forces in building wealth — the earlier you start, the bigger it grows.`}, he:{t:`ריבית דריבית`,b:`ריבית דריבית משמעה שאתם מרוויחים ריבית לא רק על הכסף המקורי, אלא גם על הריבית שכבר הרווחתם. לאורך שנים רבות, "אפקט כדור השלג" הזה הוא אחד הכוחות החזקים ביותר בבניית עושר — ככל שמתחילים מוקדם יותר, כך הוא גדל יותר.`}, ar:{t:`الفائدة المركبة`,b:`الفائدة المركبة تعني أنك تكسب فائدة ليس فقط على مالك الأصلي، بل أيضاً على الفائدة التي كسبتها سابقاً. على مدى سنوات طويلة، يُعد هذا "تأثير كرة الثلج" من أقوى القوى في بناء الثروة — كلما بدأت أبكر، كلما نما أكثر.`}},
   {id:'terminology',lv:1, en:{t:`Speaking the Language of Money`,b:`Finance has its own vocabulary — words like "asset," "yield," or "portfolio." Learning these terms isn't about sounding smart; it's about being able to read a bank statement, a payslip, or an investment app without feeling lost.`}, he:{t:`לדבר את שפת הכסף`,b:`לפיננסים יש אוצר מילים משלהם — מונחים כמו "נכס", "תשואה" או "תיק השקעות". ללמוד את המונחים האלה זה לא כדי להישמע חכמים, אלא כדי להיות מסוגלים לקרוא דף חשבון בנק, תלוש שכר או אפליקציית השקעות בלי להרגיש אבודים.`}, ar:{t:`التحدث بلغة المال`,b:`للمال مفرداته الخاصة — كلمات مثل "الأصل" و"العائد" و"المحفظة الاستثمارية". تعلّم هذه المصطلحات ليس ليبدو كلامك ذكياً، بل لتتمكن من قراءة كشف حساب بنكي أو قسيمة راتب أو تطبيق استثمار دون أن تشعر بالضياع.`}}
  ]}
 ]}
